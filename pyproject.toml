[project]
name = "minimal-harness"
version = "0.8.0a5"
description = "A lean Python agent SDK — core abstractions, registries, runtime, and event protocol for LLM-powered agents."
readme = "README.md"
authors = [
    { name = "J0ey1iu", email = "joeyliu086@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "httpx",
    "openai",
]

[project.urls]
source = "https://github.com/J0ey1iu/minimal-harness"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.10.12,<0.12"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minimal_harness = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff",
    "pyright",
]
